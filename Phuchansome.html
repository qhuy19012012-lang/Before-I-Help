<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before I Help</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    overflow: hidden;
  }

  #viewport {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  #world {
    position: absolute;
    width: 3000px;
    height: 3000px;
    background: 
      linear-gradient(#7ec850 1px, transparent 1px),
      linear-gradient(90deg, #7ec850 1px, transparent 1px);
    background-size: 100px 100px;
  }

  #player {
    width: 48px;
    height: 48px;
    background: red;
    position: absolute;
    left: 1500px;
    top: 1500px;
  }

  canvas,
  #dialogue-box,
  #gametitle,
  #startgame,
  #settings,
  #achievements,
  #settings-menu,
  #achievements-menu,
  #btt {
    position: fixed;
    z-index: 10;
  }
</style>
</head>

<body>

<div id="viewport">
  <div id="world">
    <div id="player"></div>
  </div>
</div>

<canvas id="game_canvas"></canvas>

<div id="dialogue-box">
    <p id="dialogue-text">đang test</p>
    <button id="next-btn">Next</button>
</div>

<h1 id="gametitle" style="top:40%;font-family: PixelFont;">Game</h1>

<button id="startgame"
style="padding:20px;border:2px white solid;font-size:200%;width:25%;top:50%;cursor:pointer;font-family: PixelFont;">
Play
</button>

<script src="game.js"></script>

<script>
const world = document.getElementById("world");
const player = document.getElementById("player");

let playerX = 1500;
let playerY = 1500;
let speed = 4;

const keys = {};

document.addEventListener("keydown", (e) => keys[e.key] = true);
document.addEventListener("keyup", (e) => keys[e.key] = false);

function gameLoop() {
  if (keys["ArrowLeft"] || keys["a"]) playerX -= speed;
  if (keys["ArrowRight"] || keys["d"]) playerX += speed;
  if (keys["ArrowUp"] || keys["w"]) playerY -= speed;
  if (keys["ArrowDown"] || keys["s"]) playerY += speed;

  player.style.left = playerX + "px";
  player.style.top = playerY + "px";

  const offsetX = window.innerWidth / 2 - playerX;
  const offsetY = window.innerHeight / 2 - playerY;

  world.style.transform = `translate(${offsetX}px, ${offsetY}px)`;

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
