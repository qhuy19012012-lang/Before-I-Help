<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Before I Help</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>

<body style="background-color: black;">
    <canvas id="game_canvas"></canvas>

    <div id="dialogue-box">
        <p id="dialogue-text">đang test</p>
        <button id="next-btn">Next</button>
    </div>
    <h1 id="gametitle" style="position:fixed;top:40%;border:0px;font-family: PixelFont;">Game</h1>
    <button style="padding: 20px; position: fixed;border: 2px white solid;font-size: 200%; width: 25%;top:50%;cursor: pointer;font-family: PixelFont;" id="startgame">Play</button>
    <button style="padding: 5px; position: fixed;bottom: 0;right: 0;width: 4%;height:8%;border:5px ridge rgb(173, 173, 173);" id="settings">
        <img src="sprites/setting.png" width="100%" height="100%" alt="Settings" style="object-fit: scale-down;" title="Settings">
    </button> 
    <button style="padding: 5px; position: fixed;bottom: 0;right: 0;width: 4%;height:8%;border:5px ridge rgb(173, 173, 173);margin-right: 61.25px;" id="achievements">
        <img src="sprites/badge.png" width="100%" height="100%" alt="Achievements" style="object-fit: scale-down;" title="Achievements">
    </button>
    <div id="settings-menu" style="visibility: hidden; position: fixed; bottom: 10%; right: 10%; width: 300px; height: 200px; background-color: rgb(0, 0, 0); border: 2px solid rgb(255, 255, 255); padding: 20px;overflow: scroll;">
        <h2 style="margin:0px">Settings</h2>
        <label for="test-slider">Placeholder:</label>
        <input type="range" id="test-slider">
        <br>
        <label for="test-checkbox">Placeholder:</label>
        <input type="checkbox" id="test-checkbox">
        <br>
        <label for="test-text">Placeholder:</label>
        <input type="text" id="test-text">
        <br>
        <label for="test-select">Placeholder:</label>
        <select id="test-select">
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
            <option value="option3">Option 3</option>
        </select>
    <button id="close-settings" style="top:0px; right: 0px; position:absolute;font-family: Tahoma, Geneva, Verdana, sans-serif;text-align: center;"><b>Close</b></button>
    </div>
    <div id="achievements-menu" style="visibility: hidden; position: fixed; bottom: 10%; right: 10%; width: 300px; height: 200px; background-color: rgb(0, 0, 0); border: 2px solid rgb(255, 255, 255); padding: 20px;overflow:scroll">
        <h2 style="margin:0px">Achievements</h2>
        <div style="border: 2px solid white;overflow: hidden;height:30px;width:100%;position:relative;line-height: 0;">
            <i style="position:relative;z-index: 4;top: 50%;">Progress: 0/0 (0%)</i>
            <div style="background-color: green;width: 30%;height: 100%;position: relative;">
            </div>
        </div>
        <div id="a1" style="overflow: hidden;width:50px;height: 50px;border: 1px solid white;word-wrap: break-word">
            <p style="margin:0px">placeholder</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
